# Designar · avisos no celular
# Roda de 2 em 2 horas, das 7h às 19h (horário de Brasília). Na primeira vez do dia envia os lembretes das
# designações; em todas avisa os administradores de pedidos de acesso novos.
# Para testar: aba Actions › "Avisos das designações" › Run workflow (com "teste" marcado, só o administrador recebe).
name: Avisos das designações
on:
  schedule:
    - cron: '17 10-22/2 * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só um aviso de teste para os administradores'
        type: boolean
        default: true
      forcar:
        description: 'Enviar os lembretes de hoje mesmo que já tenham saído'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: avisos
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund --prefix fonte/src/avisos firebase-admin@12.7.0
      - run: node fonte/src/avisos/enviar.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTE: ${{ github.event.inputs.teste }}
          FORCAR: ${{ github.event.inputs.forcar }}
