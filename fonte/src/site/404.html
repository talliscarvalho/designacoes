<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<title>Página não encontrada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F5249'/%3E%3Cpath fill='white' transform='translate(4 4) scale(1)' d='%%MARCA%%'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@1,300&display=swap">
<style>
:root{--bg:#F3F5F4;--surface:#FFFFFF;--fg:#1C2623;--muted:#5D6B66;--line:#D5DDDA;--accent:#2F5249;--accent-fg:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--surface:#1A2220;--fg:#E6ECEA;--muted:#9AA8A3;--line:#33403C;--accent:#7FB5A6;--accent-fg:#0E1513}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.logo{width:52px;height:52px;border-radius:14px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-fg)}
.wm{font-family:"Open Sans",system-ui,sans-serif;font-style:italic;font-weight:300;font-size:30px;margin:-6px 0 14px;color:var(--fg)}
.code{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0 0 6px}
h1{font-size:23px;margin:0 0 10px;line-height:1.25}
p{margin:0 0 22px;font-size:15px;line-height:1.55;color:var(--muted)}
a.btn{display:inline-flex;justify-content:center;width:100%;padding:12px 16px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:15.5px;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.foot{margin-top:16px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24"><path fill="currentColor" d="%%MARCA%%"/></svg></div>
  <p class="code">ERRO 404</p>
  <h1>Esta página não existe</h1>
  <p>O endereço pode ter sido digitado errado ou o link mudou. As designações continuam no lugar de sempre.</p>
  <a class="btn" id="home" href="./">Ir para o início</a>
  <div class="foot">Cada um com seu dom, tudo em seu lugar.</div>
</main>
<script>
/* volta para a página inicial do site, qualquer que seja o nome do repositório */
(function(){var seg=location.pathname.split('/').filter(Boolean)[0];var h=location.hostname.endsWith('github.io')&&seg?'/'+seg+'/':'/';document.getElementById('home').href=h})();
</script>
</body>
</html>
