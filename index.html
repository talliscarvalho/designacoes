<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Designar</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com https://www.gstatic.com https://www.google.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://apis.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>/* impede que o site seja aberto dentro de outra página (golpe de "clique falso") */if(window.top!==window.self){document.documentElement.style.display='none';try{window.top.location=window.self.location.href}catch(e){}}</script>
<meta name="theme-color" content="#2F5249">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Designar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F5249'/%3E%3Cpath fill='white' transform='translate%284 4%29' d='M3 6.4c2.6-1.1 5.6-1 8 .7v11.2c-2.4-1.6-5.4-1.7-8-.6zM21 6.4c-2.6-1.1-5.6-1-8 .7v11.2c2.4-1.6 5.4-1.7 8-.6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@1,300&display=swap">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<script src="config.js"></script>
</head>
<body>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-auth-compat.js"></script>
<script src="lib/firebase-firestore-compat.js"></script>
<script>
/* Conexão com o Firebase: login com Google, lista de acesso ("acesso"), aceite do termo de uso ("aceites")
   e dados públicos do aviso de privacidade ("publico/info"). O administrador principal também está fixo nas regras. */
(function(){try{const t=localStorage.getItem('vmc-tema');if(t==='claro')document.documentElement.dataset.theme='light';else if(t==='escuro')document.documentElement.dataset.theme='dark'}catch(e){}})();
(function(){
  /* dados desta instalação: ficam no arquivo config.js (veja o LEIAME para usar em outra congregação) */
  const CFG=window.DESIGNAR_CONFIG||{};
  const FIREBASE_CONFIG=CFG.firebase;
  const OWNER=String(CFG.dono||'').trim().toLowerCase();
  const APP="Designar", VERSAO="2026.11.06-0948", TERMOS_V=1, DOCS_DATA="5 de novembro de 2026";
  const FBX=window.FBX={papel:null,email:null,owner:OWNER,app:APP,versao:VERSAO,whatsapp:CFG.whatsapp||'',pub:{}};
  const t=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let resolveReady,rejectReady;const readyP=new Promise((r,j)=>{resolveReady=r;rejectReady=j});
  readyP.catch(()=>{}); /* o sistema trata a falha em init(); evita aviso de promessa sem tratamento */
  FBX.ready=()=>readyP;

  /* ---------- Textos: aviso de privacidade, termo de uso e sobre ---------- */
  const resp=()=>FBX.pub.responsavel?t(FBX.pub.responsavel):'os anciãos da congregação';
  const contato=()=>FBX.pub.contato?` pelo contato <b>${t(FBX.pub.contato)}</b>`:'';
  const cong=()=>FBX.pub.congregacao?'a Congregação '+t(String(FBX.pub.congregacao).replace(/^Congrega[cç][aã]o\s+/i,'')):'a congregação que usa este sistema';
  const DOCS={
    privacidade:()=>`<h2>Aviso de privacidade</h2><p class="fbdate">Atualizado em ${DOCS_DATA}</p>
      <p>Este aviso explica, de forma simples, quais dados pessoais o ${APP} guarda, para que eles servem e quais são os seus direitos, conforme a Lei Geral de Proteção de Dados (LGPD, Lei nº 13.709/2018).</p>
      <h3>Quem cuida dos dados</h3><p>O sistema é usado por ${cong()} para organizar os seus arranjos. Os responsáveis pelos dados são ${resp()}${contato()}.</p>
      <h3>Quais dados são guardados</h3><ul>
        <li><b>Dos publicadores:</b> nome, telefone (WhatsApp), em que partes cada um pode ser designado, privilégios de serviço (ancião, servo ministerial, pioneiro), histórico de designações, grupo de limpeza e saídas de campo que dirige.</li>
        <li><b>De quem tem acesso ao sistema:</b> e-mail e nome da conta Google, nível de permissão, data do aceite do termo de uso, último acesso e registro das alterações feitas.</li></ul>
      <p>Não são guardados endereço, data de nascimento, documentos nem dados financeiros.</p>
      <h3>Dado sensível</h3><p>Como essas informações revelam a vinculação religiosa das pessoas, a LGPD as trata como <b>dado pessoal sensível</b>. Por isso, o acesso é restrito e o uso se limita aos arranjos internos da congregação.</p>
      <h3>Para que são usados</h3><p>Exclusivamente para organizar e comunicar designações das reuniões, da limpeza do Salão do Reino, de áudio/vídeo e indicadores e das saídas de campo, além do controle de itens de limpeza. Os dados <b>não são vendidos, não são usados para propaganda e não são compartilhados</b> com terceiros para outros fins.</p>
      <h3>Quem pode ver</h3><p>Somente pessoas autorizadas por um administrador, com login pela conta Google. Há três níveis: só visualizar, editar e administrar. As folhas impressas para o quadro de anúncios mostram apenas o nome de quem tem cada designação. As mensagens de aviso são enviadas pelo WhatsApp do próprio usuário, a partir do celular dele.</p>
      <h3>Onde ficam guardados</h3><p>No Google Firebase (Cloud Firestore), com servidor em São Paulo (Brasil). O login é feito pelo Google. A página do sistema é hospedada no GitHub Pages, que não recebe os dados pessoais. Cópias de segurança baixadas por administradores ficam sob a responsabilidade de quem as baixou.</p>
      <h3>Por quanto tempo</h3><p>Enquanto forem necessários para os arranjos da congregação. Quando um publicador deixa a congregação ou pede a exclusão, os dados dele são removidos do cadastro. Quem deixa de ter acesso ao sistema é retirado da lista de acesso.</p>
      <h3>Seus direitos</h3><p>Você pode pedir para <b>saber quais dados seus estão guardados</b>, <b>corrigir</b> algo errado, <b>apagar</b> os seus dados ou <b>tirar dúvidas</b> sobre este aviso. Para isso, fale com ${resp()}${contato()}.</p>
      <h3>Segurança</h3><p>Conexão criptografada (HTTPS), acesso só com login e lista de autorizados, regras de permissão no servidor e registro de quem alterou cada informação.</p>
      <h3>Cookies e rastreamento</h3><p>O sistema não usa cookies de propaganda, não tem rastreamento e não coleta estatísticas de uso. O navegador guarda apenas o login e algumas preferências de tela.</p>`,
    termos:()=>`<h2>Termo de uso e confidencialidade</h2><p class="fbdate">Versão ${TERMOS_V} · ${DOCS_DATA}</p>
      <p>O ${APP} reúne nomes, telefones e informações dos publicadores da congregação. Ao usar o sistema, você se compromete a:</p><ol>
        <li><b>Usar os dados só para os arranjos da congregação</b> (designações, limpeza, áudio/vídeo e indicadores, saídas de campo e avisos), nunca para outros fins.</li>
        <li><b>Não compartilhar</b> telefones, listas, prints de tela, PDFs com dados pessoais ou cópias de segurança com quem não tem acesso autorizado.</li>
        <li><b>Não emprestar o seu acesso</b> e sair da conta em aparelhos de outras pessoas.</li>
        <li><b>Avisar um administrador</b> se perder o celular, se a sua conta Google for invadida ou se perceber algum uso indevido.</li>
        <li><b>Manter os dados corretos</b> e respeitar os pedidos de correção ou exclusão feitos pelos publicadores.</li>
        <li>Saber que <b>as alterações ficam registradas</b> com o seu nome, data e hora.</li></ol>
      <p>O acesso pode ser retirado a qualquer momento pelos administradores. Leia também o <a href="#" data-doc="privacidade">aviso de privacidade</a>.</p>`,
    sobre:()=>`<h2>Sobre o ${APP}</h2><p class="fbdate">Versão ${VERSAO}</p>
      <p><b>${APP}</b> reúne num só lugar as designações da congregação. O lema vem de 1 Pedro 4:10: cada um usa o dom que recebeu para servir aos outros, e tudo fica em seu lugar.</p>
      <p>O sistema organiza designações das reuniões do meio de semana e do fim de semana, limpeza do Salão do Reino, áudio/vídeo e indicadores, saídas de campo e itens de limpeza, com folhas em PDF para o quadro de anúncios e avisos pelo WhatsApp.</p>
      <p>É uma ferramenta independente, feita para uso interno das congregações, e não é um produto oficial de nenhuma organização.</p>
      <h3>Responsável</h3><p>${FBX.pub.responsavel?t(FBX.pub.responsavel)+(FBX.pub.contato?' · '+t(FBX.pub.contato):''):'Os anciãos da congregação.'}</p>
      <p><a href="#" data-doc="privacidade">Aviso de privacidade</a> · <a href="#" data-doc="termos">Termo de uso</a></p>`
  };
  function openDoc(k){let o=document.getElementById('fbdoc');if(!o){o=document.createElement('div');o.id='fbdoc';document.body.appendChild(o)}
    o.innerHTML=`<div class="fbdocback"></div><div class="fbdocbox" role="dialog" aria-modal="true"><button class="fbdocx" aria-label="Fechar">✕</button><div class="fbdoctxt">${DOCS[k]()}</div><div class="fbdocfoot"><button class="fbbtn fbsec" data-close>Fechar</button></div></div>`;
    o.hidden=false;const close=()=>{o.hidden=true};o.querySelector('.fbdocback').onclick=close;o.querySelector('.fbdocx').onclick=close;o.querySelector('[data-close]').onclick=close;
    o.querySelector('.fbdoctxt').scrollTop=0;o.querySelector('.fbdocx').focus()}
  FBX.openDoc=openDoc;
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-doc]');if(!a)return;e.preventDefault();openDoc(a.dataset.doc)});
  document.addEventListener('keydown',e=>{const o=document.getElementById('fbdoc');if(e.key==='Escape'&&o&&!o.hidden)o.hidden=true});

  const LOCKUP=`<div class="fblock"><span class="fbmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6.4c2.6-1.1 5.6-1 8 .7v11.2c-2.4-1.6-5.4-1.7-8-.6zM21 6.4c-2.6-1.1-5.6-1-8 .7v11.2c2.4-1.6 5.4-1.7 8-.6z"/></svg></span></div>`;
  const LINKS=`<nav class="fblinks" aria-label="Documentos"><a href="#" data-doc="privacidade">Privacidade</a><a href="#" data-doc="termos">Termo de uso</a><a href="#" data-doc="sobre">Sobre</a><a href="#" class="fbhelp" target="_blank" rel="noopener noreferrer">Ajuda</a></nav>`;
  /* "Ajuda": e-mail ao desenvolvedor com assunto e roteiro preenchidos */
  const helpMail=()=>{const n=String(CFG.whatsapp||'5575992799894').replace(/\D/g,'');const ap=/iPhone|iPad/.test(navigator.userAgent)?'iPhone/iPad':/Android/.test(navigator.userAgent)?'Android':/Windows/.test(navigator.userAgent)?'Windows':/Mac/.test(navigator.userAgent)?'Mac':'outro';
    return 'https://wa.me/'+n+'?text='+encodeURIComponent('Olá! Preciso de ajuda para entrar no sistema de designações.\n\n(conte o que aconteceu)\n\n— Versão '+VERSAO+' · '+ap)};
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('.fbhelp');if(a)a.href=helpMail()},true);
  if(!window.firebase||!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){const fail=()=>{gate('falha');const b=document.getElementById('fbRetry');if(b)b.onclick=()=>location.reload()};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fail);else fail();rejectReady({code:'sem-firebase'});return}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),fs=firebase.firestore();
  auth.languageCode='pt';
  const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
  /* guarda os dados no aparelho: abre e mostra a última versão mesmo sem internet, e envia as alterações quando a conexão voltar */
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const ts=()=>firebase.firestore.FieldValue.serverTimestamp();
  if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  const CACHEK='vmc-acesso-cache';const cacheGet=e=>{try{const c=JSON.parse(localStorage.getItem(CACHEK)||'{}');return c.email===e?c:null}catch(x){return null}};
  const cacheSet=d=>{try{localStorage.setItem(CACHEK,JSON.stringify(d))}catch(x){}};
  fs.doc('publico/info').get().then(d=>{if(d.exists)FBX.pub=d.data()||{}}).catch(()=>{});

  function gate(kind,msg){let g=document.getElementById('fbgate');
    if(!g){g=document.createElement('div');g.id='fbgate';document.body.appendChild(g)}
    if(kind==='termos'){g.innerHTML=`<div class="fbcard fbwide"><div class="fbdoctxt fbinline">${DOCS.termos()}</div>
        <label class="fbchk"><input type="checkbox" id="fbAgree"><span>Li e concordo com o termo de uso e com o <a href="#" data-doc="privacidade">aviso de privacidade</a>.</span></label>
        <button class="fbbtn fbprim" id="fbAccept" disabled>Aceitar e entrar</button><button class="fbbtn fbsec" id="fbOut">Não aceito, sair</button></div>`;
      g.hidden=false;const c=document.getElementById('fbAgree'),b=document.getElementById('fbAccept');c.onchange=()=>{b.disabled=!c.checked};
      b.onclick=async()=>{b.disabled=true;b.textContent='Salvando…';try{await fs.doc('aceites/'+FBX.email).set({versao:TERMOS_V,em:ts(),ultimo:ts(),nome:FBX.nome||''});cacheSet({email:FBX.email,papel:FBX.papel,pubId:FBX.pubId,aceite:TERMOS_V});enter()}catch(e){b.disabled=false;b.textContent='Aceitar e entrar';alertBox('Não foi possível registrar o aceite ('+(e.code||'erro')+'). Tente de novo.')}};
      document.getElementById('fbOut').onclick=()=>auth.signOut();return}
    const H=(t,p)=>`<h1 class="fbh">${t}</h1>${p?`<p class="fbsub">${p}</p>`:''}`;
    const body={
      login:H('Entrar','Entre com o e-mail que você informou aos anciãos.')+`<button class="fbbtn" id="fbLogin"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continuar com Google</button>
        <div class="fbor"><span>ou receba um link no e-mail</span></div>
        <form id="fbMailForm" class="fbmail" novalidate><label for="fbMail" class="fblab">E-mail</label><input type="email" id="fbMail" required maxlength="254" placeholder="nome@exemplo.com" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"><button class="fbbtn fbprim" type="submit">Enviar link de acesso</button></form>`,
      link:H('Confira seu e-mail',`Enviamos um link de acesso para <b>${t(msg)}</b>.`)+`<p class="fbnote">Abra o e-mail <b>neste mesmo aparelho</b> e toque no link. Se não chegar em alguns minutos, veja a caixa de spam.</p><button class="fbbtn" id="fbBack">Usar outro e-mail</button>`,
      confirmar:H('Confirme o e-mail','Para terminar a entrada, digite o e-mail para o qual o link foi enviado.')+`<form id="fbConfForm" class="fbmail"><label for="fbConf" class="fblab">E-mail</label><input type="email" id="fbConf" required maxlength="254" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="nome@exemplo.com"><button class="fbbtn fbprim" type="submit">Entrar</button></form>`,
      espera:`<div class="fbwait" role="status"><span class="fbspin" aria-hidden="true"></span><p>${t(msg||'Conectando…')}</p></div>`,
      negado:H('Acesso ainda não liberado',`A conta <b>${t(msg)}</b> ainda não tem acesso ao sistema.`)+`<p class="fbnote">Peça a um administrador para incluir este e-mail em Ajustes › Acesso ao sistema. Depois, recarregue a página.</p><button class="fbbtn" id="fbOut">Entrar com outra conta</button>`,
      erro:H('Não foi possível entrar',t(msg))+`<button class="fbbtn" id="fbLogin">Tentar de novo</button>`,
      falha:H('Não foi possível carregar','Verifique a internet e tente de novo.')+`<p class="fbnote">Se continuar, desative bloqueadores de anúncios ou extensões de privacidade para este site, ou abra em outro navegador.</p><button class="fbbtn" id="fbRetry">Tentar de novo</button>`
    }[kind]||'';
    g.innerHTML=`<div class="fbshell">
      <aside class="fbside"><div class="fbsidein">${LOCKUP}<p class="fbtag">Gerencie o quadro de anúncios <br class="fbbr">da sua congregação em um só lugar.</p><p class="fbabout">O ${APP.toUpperCase()} é um apoio digital ao quadro de anúncios da congregação. Ele organiza as designações e faz com que cada publicador fique sabendo, a tempo, do que lhe cabe.</p></div>
        <figure class="fbverse"><blockquote>Mas que todas as coisas ocorram com decência e ordem.</blockquote><figcaption>1 Cor. 14:40.</figcaption></figure></aside>
      <main class="fbmain"><div class="fbpanel">${body}</div>${LINKS}</main></div>`;
    g.hidden=false;
    const lb=document.getElementById('fbLogin');if(lb)lb.onclick=login;
    const mf=document.getElementById('fbMailForm');if(mf)mf.onsubmit=e=>{e.preventDefault();const v=document.getElementById('fbMail').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){alertBox('Digite um e-mail válido, como nome@exemplo.com.');document.getElementById('fbMail').focus();return}sendLink(v)};
    const cf=document.getElementById('fbConfForm');if(cf)cf.onsubmit=e=>{e.preventDefault();finishLink(document.getElementById('fbConf').value)};
    const bk=document.getElementById('fbBack');if(bk)bk.onclick=()=>gate('login');
    const ob=document.getElementById('fbOut');if(ob)ob.onclick=()=>auth.signOut().then(()=>gate('login'));
  }
  function alertBox(m){const g=document.querySelector('#fbgate .fbpanel')||document.querySelector('#fbgate .fbcard');if(!g)return;let a=g.querySelector('.fberr');if(!a){a=document.createElement('p');a.className='fberr';a.setAttribute('role','alert');g.appendChild(a)}a.textContent=m}
  function hideGate(){const g=document.getElementById('fbgate');if(g)g.hidden=true}
  async function login(){
    gate('espera','Abrindo a janela do Google…');
    try{await auth.signInWithPopup(provider)}
    catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await auth.signInWithRedirect(provider);return}catch(e2){e=e2}}
      if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request'){gate('login');return}
      if(e.code==='auth/unauthorized-domain'){gate('erro','Este endereço ainda não foi autorizado no Firebase (Authentication › Configurações › Domínios autorizados): '+location.hostname);return}
      if(e.code==='auth/network-request-failed'){gate('erro','Sem conexão com a internet. Verifique a rede e tente de novo.');return}
      gate('erro','Não foi possível entrar ('+(e.code||e.message||'erro')+').');
    }
  }
  /* entrada por link no e-mail (sem senha) */
  const MAILKEY='vmc-mail-login';
  async function sendLink(email){email=String(email||'').trim().toLowerCase();if(!email)return;gate('espera','Enviando o link para '+email+'…');
    try{await auth.sendSignInLinkToEmail(email,{url:location.origin+location.pathname,handleCodeInApp:true});try{localStorage.setItem(MAILKEY,email)}catch(e){}gate('link',email)}
    catch(e){gate('erro',e.code==='auth/operation-not-allowed'?'A entrada por e-mail ainda não foi ativada no Firebase (Authentication › Método de login › E-mail/senha › Link do e-mail).':e.code==='auth/quota-exceeded'?'O limite diário de envio de links foi atingido. Tente amanhã ou entre com Google.':e.code==='auth/invalid-email'?'Esse e-mail não parece válido.':'Não foi possível enviar o link ('+(e.code||'erro')+').')}}
  let completingLink=false;
  async function finishLink(email){email=String(email||'').trim().toLowerCase();completingLink=true;gate('espera','Entrando…');
    try{await auth.signInWithEmailLink(email,location.href);try{localStorage.removeItem(MAILKEY)}catch(e){}history.replaceState(null,'',location.pathname+location.hash)}
    catch(e){completingLink=false;gate('erro',e.code==='auth/invalid-action-code'||e.code==='auth/expired-action-code'?'Este link já foi usado ou expirou. Peça um novo.':e.code==='auth/invalid-email'?'O e-mail não confere com o do link.':'Não foi possível entrar ('+(e.code||'erro')+').')}}
  if(auth.isSignInWithEmailLink(location.href)){completingLink=true;let em=null;try{em=localStorage.getItem(MAILKEY)}catch(e){}
    const go=()=>{if(em)finishLink(em);else gate('confirmar')};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()}
  let started=false;
  function enter(){started=true;hideGate();resolveReady(fs);
    fs.doc('aceites/'+FBX.email).set({ultimo:ts()},{merge:true}).catch(()=>{})}
  auth.onAuthStateChanged(async u=>{
    if(!u){if(started){location.reload();return}if(completingLink)return;gate('login');return}
    const email=String(u.email||'').toLowerCase();
    if(started){if(email!==FBX.email)location.reload();return}
    gate('espera','Verificando acesso de '+email+'…');
    let papel=null;
    if(email===OWNER)papel='admin';
    let pubId=null,lido=false;
    try{const d=await fs.doc('acesso/'+email).get();lido=true;if(d.exists){const x=d.data()||{};if(email!==OWNER)papel=x.papel||'leitor';pubId=x.pub||null}}catch(e){}
    /* sem internet: usa o último acesso conferido neste aparelho */
    const cc=cacheGet(email);if(!lido&&cc){papel=papel||cc.papel;pubId=cc.pubId||null}
    if(!papel){gate('negado',email);return}
    FBX.email=email;FBX.papel=papel;FBX.pubId=pubId;FBX.nome=u.displayName||'';
    if(papel==='publicador'&&!pubId){gate('erro','Seu acesso ainda não foi ligado a um cadastro de publicador. Peça a um administrador para fazer a ligação em Ajustes › Acesso ao sistema.');return}
    let ok=false,lidoA=false;try{const a=await fs.doc('aceites/'+email).get();lidoA=true;ok=a.exists&&((a.data()||{}).versao||0)>=TERMOS_V}catch(e){}
    if(!lidoA&&cc&&cc.aceite>=TERMOS_V)ok=true;
    if(ok)cacheSet({email,papel,pubId,aceite:TERMOS_V});
    if(!ok){gate('termos');return}
    enter();
  });
  FBX.signOut=()=>{try{localStorage.removeItem(CACHEK)}catch(e){}return auth.signOut()};
  FBX.ts=ts;
  FBX.quiet=false;
  FBX.log=(acao,col,id)=>{if(FBX.quiet)return Promise.resolve();return fs.collection('registro').add({acao,col,id:String(id),por:FBX.email,nome:FBX.nome||'',em:ts()}).catch(()=>{})};
  FBX.recent=(cb,err)=>fs.collection('registro').orderBy('em','desc').limit(40).onSnapshot(s=>cb(s.docs.map(d=>d.data())),err);
  /* cópias automáticas, registro de erros e teste de conexão (veja "Cuidados do sistema") */
  FBX.copias={listar:(cb,err)=>fs.collection('copias').orderBy('em','desc').limit(12).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),err),
    salvar:(id,dados,n,auto)=>fs.doc('copias/'+id).set({dados,n,auto:!!auto,por:FBX.email,em:ts()}),apagar:id=>fs.doc('copias/'+id).delete()};
  FBX.erro=d=>fs.collection('erros').add(Object.assign({},d,{por:FBX.email,em:ts()}));
  FBX.erros={listar:(cb,err)=>fs.collection('erros').orderBy('em','desc').limit(30).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),err),apagar:id=>fs.doc('erros/'+id).delete()};
  FBX.ping=()=>fs.doc('publico/info').get({source:'server'});
  FBX.listAccess=(cb,err)=>fs.collection('acesso').onSnapshot(s=>cb(s.docs.map(d=>Object.assign({email:d.id},d.data()))),err);
  FBX.listAceites=(cb,err)=>fs.collection('aceites').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());cb(m)},err);
  FBX.setAccess=(email,papel,pub)=>{const d={papel,por:FBX.email,em:new Date().toISOString()};if(pub!==undefined)d.pub=pub||null;return fs.doc('acesso/'+email.toLowerCase()).set(d,{merge:true})};
  FBX.setResposta=(k,d)=>fs.doc('respostas/'+k).set(Object.assign({},d,{por:FBX.email,nome:FBX.nome||'',em:ts()}));
  FBX.delResposta=k=>fs.doc('respostas/'+k).delete();
  FBX.myPubDoc=()=>fs.doc('publicadores/'+FBX.pubId).get().then(d=>d.exists?d.data():null);
  FBX.delAccess=email=>fs.doc('acesso/'+email.toLowerCase()).delete();
  FBX.setPublic=d=>fs.doc('publico/info').set(Object.assign({},FBX.pub,d,{_por:FBX.email,_em:ts()})).then(()=>{FBX.pub=Object.assign({},FBX.pub,d)});
  document.addEventListener('DOMContentLoaded',()=>{if(!started&&!document.getElementById('fbgate'))gate('espera','Conectando…')});
})();
</script>

<style>
/* Layout: app bar com abas; à esquerda a lista de semanas, à direita o editor colorido por seção (as mesmas cores da folha impressa). */

  --bg:#F2F1EE; --surface:#FFFFFF; --surface-2:#F0EEEA; --fg:#1B1B1B; --muted:#5F6368; --line:#DAD8D3; --line-2:#ECEAE5; --line-b:#C9C6BF;

  --pub:#2C4A7A; --pub-bg:#E9EDF4; --sent:#4D6A51; --sent-bg:#EDF1EC; --open:#4A4F55;

  --accent:#8CC2B2; --accent-fg:#0E1513; --accent-soft:#22332D;
  --tes:#4E6A75; --tes-bg:#1E272B; --min:#94600B; --min-bg:#2A2216; --vida:#8C1C2B; --vida-bg:#2C1A1D;
  --pub:#2C4A7A; --pub-bg:#1D2433; --sent:#4D6A51; --sent-bg:#1D261F; --open:#4A4F55;
  --ok:#6CC28F; --warn:#F0B35A; --warn-bg:#33270F; --err:#F2877E; --ev:#F08A98; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1C201F; --surface-2:#262B29; --fg:#E8E9E7; --muted:#A3A8A6; --line:#343A38; --line-2:#2A2F2D; --line-b:#4A514E;

/* Todas as designações de uma semana */
function roles(w){
  const tp=evTipo(w.data);if(SEM_REUNIAO(tp))return[];
  const r=[];const add=(pub,field,txt)=>{if(pub)r.push({pub,field,txt})};
  add(w.presidente,'presidente','Presidente da reunião'+w.ministerio.map((p,i)=>isPres(p)?'\n   Inclui a parte '+(4+i)+': '+(p.tema||'')+' ('+(p.min||'?')+' min)':'').join(''));
  add(w.oracaoInicial,'oracaoInicial','Oração inicial'+(w.canticoInicial?' (após o Cântico '+w.canticoInicial.split(' ')[0]+')':''));
  add(w.tesouros.pub,'tesouros.pub','Tesouros da Palavra de Deus: “'+(w.tesouros.tema||'discurso')+'” (10 min)');
  add(w.joias.pub,'joias.pub','Encontre Joias Espirituais (10 min)');

  w.ministerio.forEach((p,i)=>{const n=4+i;if(isPres(p))return;
    add(p.pub,'ministerio.'+i+'.pub','Faça Seu Melhor no Ministério, parte '+n+': '+(p.tema||'')+' ('+(p.min||'?')+' min)'+(p.ajudante&&!isDiscurso(p)?'\n   Ajudante: '+pn(p.ajudante):''));
    if(!isDiscurso(p))add(p.ajudante,'ministerio.'+i+'.ajudante','Ajudante na parte '+n+': '+(p.tema||'')+' ('+(p.min||'?')+' min)'+(p.pub?'\n   Estudante: '+pn(p.pub):''));});
  w.vida.forEach((p,i)=>add(p.pub,'vida.'+i+'.pub','Nossa Vida Cristã: “'+(p.tema||'')+'” ('+(p.min||'?')+' min)'));

  add(w.estudo.leitor,'estudo.leitor','Leitor do Estudo Bíblico de Congregação');}
  add(w.oracaoFinal,'oracaoFinal','Oração final');
  return r}

    const folha=/Reuni[aã]o Vida e Minist[eé]rio Crist[aã]os?\s*[-–]\s*\p{L}+\s+\d{4}/iu.test(t)&&(t.match(/\b\d{2}\/\d{2}\/\d{4}\b/g)||[]).length>=2;
    if(!r.semanas.length&&folha)throw new Error('Este arquivo é uma programação já preenchida (a folha do quadro de anúncios), não a apostila. Para importar, use a Apostila da Reunião Vida e Ministério (arquivo mwb) baixada do jw.org, em PDF ou RTF.');
    if(!r.semanas.length)throw new Error(impDiag.tipo==='pdf'&&impDiag.chars<200?'Este PDF não tem texto que possa ser lido (parece ser uma imagem ou digitalização). Use o PDF original da apostila, baixado do jw.org, ou o RTF.':'Não encontrei semanas neste arquivo. Confira se é a Apostila da Reunião Vida e Ministério (PDF ou RTF).');
    imp={nome:f.name,ano:r.ano,semanas:r.semanas.map(x=>Object.assign(x,{on:true}))}}
  catch(e){imp={nome:f.name,erro:(e&&e.message)||'Não foi possível ler o arquivo.'};if(/carregou/.test(imp.erro))imp.erro='Não foi possível carregar o leitor de PDF. Verifique a internet e tente de novo.';else if(/Invalid PDF|PDF structure|password/i.test(imp.erro))imp.erro='Este PDF está danificado ou protegido e não pode ser lido. Baixe a apostila de novo no jw.org e tente outra vez.'}
  rSemanas()}
function impApply(){

function pubSelect(path,cat,val,date,extraCls,attr){

  list.sort((a,b)=>a[1].nome.localeCompare(b[1].nome,'pt'));

function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++)c=c[ks[i]];c[ks[ks.length-1]]=v}
function saveWeek(w){weeks[w.data]=w;queueSave('semanas',w.data,w);buildHist()}
function nextMeetingDate(){
  const ws=sortedWeeks();let d;
  if(ws.length){d=parse(ws[ws.length-1].data);d.setDate(d.getDate()+7)}else{d=new Date();d.setHours(0,0,0,0);while(d.getDay()!==+cfg.dia)d.setDate(d.getDate()+1)}
  if(ui.month&&!ws.some(w=>w.data.startsWith(ui.month))){const[a,b]=ui.month.split('-').map(Number);const f=new Date(a,b-1,1);while(f.getDay()!==+cfg.dia)f.setDate(f.getDate()+1);if(!weeks[iso(f)])d=f}
  while(weeks[iso(d)])d.setDate(d.getDate()+7);return iso(d)}

    if(t.tagName==='SELECT'||/\.tema$/.test(t.dataset.f)&&/^ministerio/.test(t.dataset.f)){ if(t.tagName==='SELECT')rSemanas(); else{clearTimeout(rSemanas.t);rSemanas.t=setTimeout(()=>{const a=document.activeElement&&document.activeElement.dataset.f;rSemanas();if(a){const el=document.querySelector(`[data-f="${a}"]`);if(el){el.focus();if(el.setSelectionRange){const l=el.value.length;el.setSelectionRange(l,l)}}}},700)}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;

    delweekno:()=>{ui.delAsk=null;rSemanas()},
    delweekok:()=>{const id=w.data;delete weeks[id];removeDoc('semanas',id);ui.week=null;ui.delAsk=null;buildHist();rSemanas();toast('Semana excluída')},
    gowa:()=>{ui.waWeek=ui.week},
    impopen:()=>{ui.importing=true;imp=null;rSemanas();const el=document.querySelector('.imp');if(el)el.scrollIntoView({block:'start',behavior:'smooth'})},
    impclose:()=>{ui.importing=false;imp=null;rSemanas()},
    impgo:()=>impApply(),
    draw:()=>{const r=drawSisters(w,false);saveWeek(w);lastDraw={week:w.data,msg:drawMsg(r),short:!!(r.short.length||r.empty)};rSemanas()},
    redraw:()=>{const r=drawSisters(w,true);saveWeek(w);lastDraw={week:w.data,msg:drawMsg(r),short:!!(r.short.length||r.empty)};rSemanas()},
    drawmonth:()=>{const ws=sortedWeeks().filter(x=>x.data.startsWith(ui.month)&&!SEM_REUNIAO(evTipo(x.data)));let n=0,sh=[],em=0;
      ws.forEach(x=>{const r=drawSisters(x,false);if(r.n){saveWeek(x)}n+=r.n;sh=sh.concat(r.short);em+=r.empty});
      const msg=drawMsg({n,short:sh,empty:em},monthLabel(ui.month));if(!ui.week&&ws[0])ui.week=ws[0].data;
      lastDraw={week:ui.week,msg,short:!!(sh.length||em)};rSemanas();toast(n+' irmãs sorteadas em '+monthLabel(ui.month))},
  };
  if(acts[a]){acts[a]();return}
  if(PACTS[a])PACTS[a](b,e);
});

function confItens(dias){const hoje=iso(new Date()),ate=shiftDays(hoje,dias);const out=[];
  Object.keys(pubs).forEach(pid=>{if(!pubs[pid]||pubs[pid].ativo===false)return;
    myItems(pid,hoje).forEach(it=>{if(it.date>ate)return;const r=resp[respKey(it.col,it.id,it.field,pid)];
      const ac=acessoDe(pid);out.push(Object.assign({},it,{pid,st:r&&r.status==='ok'?'ok':r&&r.status==='nao'?'nao':ac==='sem'?'sem':'pend',ac,em:r&&r.em}))})});
  return out.sort((a,b)=>(a.date+(a.hora||'')+a.titulo).localeCompare(b.date+(b.hora||'')+b.titulo)||pname(a.pid).localeCompare(pname(b.pid),'pt'))}
const CF_TXT={ok:'Confirmou',nao:'Não pode',pend:'Sem resposta',sem:'Sem acesso ao painel'};
function confLembrete(it){const p=pubs[it.pid]||{};const n=waNumber(p.tel);if(!n)return'';const d=parse(it.date);

  return`<a class="btn small" target="_blank" rel="noopener noreferrer" href="https://wa.me/${esc(n)}?text=${encodeURIComponent(msg)}">Lembrar</a>`}

function printState(){const kind=ui.printKind||'meio';const C=kind==='campo',K=kind==='fds',L=kind==='limp'||kind==='av',AV=kind==='av';
  const all=C?sortedCampo().map(c=>({data:cThu(c.semana),mon:c.semana})):L?(AV?avMonths():limpMonths()).map(m=>({data:m+'-01',ym:m})):K?sortedFds():sortedWeeks();const key=C?'printSelC':AV?'printSelA':L?'printSelL':K?'printSelF':'printSel';
  /* seleção feita antes de os dados chegarem (ex.: abrir direto em Imprimir): refaz quando os dados mudam */
  if(ui[key]&&!ui[key].size&&ui[key+'N']!==all.length)ui[key]=null;
  if(!ui[key]){ui[key+'N']=all.length;const m=C?(ui.campoMonth||cThu(weekMonday(iso(new Date()))).slice(0,7)):AV?(ui.avMonth||iso(new Date()).slice(0,7)):L?(ui.limpMonth||iso(new Date()).slice(0,7)):((K?upcomingFds():upcomingWeek())||iso(new Date())).slice(0,7);ui[key]=new Set(all.filter(w=>w.data.startsWith(m)).map(w=>w.data))}
  const sel=all.filter(w=>ui[key].has(w.data));return{kind,C,K,L,AV,all,key,set:ui[key],sel,autoSub:L?sel.map(w=>cap(monthLabel(w.ym))).join(', '):sel.length?cap(monthLabel(sel[0].data.slice(0,7))):''}}

function layoutPages(sel,sub,kind,stage){
  const st=stage||$('#printStage');if(!st)return;st.innerHTML='';
  if(!sel.length){st.innerHTML=`<p class="muted">Marque o que deve aparecer na folha.</p>`;return}
  const[PW,PH]=PAPER[cfg.papel]||PAPER.A4;
  const avail=Math.min(st.clientWidth||PW,PW);const s=avail/PW;
  let page,body;
  const newPage=()=>{const wrap=document.createElement('div');wrap.className='pagewrap';wrap.style.width=PW*s+'px';wrap.style.height=PH*s+'px';
    page=document.createElement('div');page.className='page';page.style.width=PW+'px';page.style.height=PH+'px';page.style.transform=`scale(${s})`;
    page.innerHTML=pageHead(sub,kind)+'<div class="pbody"></div>';body=page.querySelector('.pbody');wrap.appendChild(page);st.appendChild(wrap)};
  newPage();
  sel.forEach(w=>{const d=document.createElement('div');d.innerHTML=kind==='campo'?campoHTML(w.mon):kind==='av'?avHTML(w.ym):kind==='limp'?limpHTML(w.ym):kind==='fds'?weekFds(w):(cfg.modelo==='s140'?weekS140(w):weekColor(w));const el=d.firstElementChild;body.appendChild(el);
    if(body.scrollHeight>body.clientHeight+1&&body.children.length>1){el.remove();newPage();body.appendChild(el)}});
}

async function saveFile(filename,blob){
  if(dl){try{await dl.save({filename,data:blob});toast('Arquivo pronto');return true}catch(e){if(e&&e.code==='declined')return false;toast('Não foi possível baixar o arquivo aqui ('+(e&&e.code||'erro')+')');return false}}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){toast('Download indisponível nesta visualização');return false}}
/* ================= PDF vetorial: texto e formas de verdade, nítidos em qualquer tamanho ================= */
const PV={dry:false,doc:null};
PV.hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
PV.rect=(x,y,w,h,col)=>{if(PV.dry)return;PV.doc.setFillColor(...PV.hex(col));PV.doc.rect(x,y,w,h,'F')};
PV.w=(t,style,size)=>{PV.doc.setFont('helvetica',style);PV.doc.setFontSize(size);return PV.doc.getTextWidth(String(t))};
PV.fit=(t,style,size,maxW,min)=>{t=String(t||'');min=min||6.5;let s=size;while(s>min&&PV.w(t,style,s)>maxW)s-=0.25;
  if(PV.w(t,style,s)>maxW){while(t.length>1&&PV.w(t+'…',style,s)>maxW)t=t.slice(0,-1);t=t.trimEnd()+'…'}return{t,s}};
PV.text=(t,x,y,style,size,col,o)=>{o=o||{};if(PV.dry||t===''||t==null)return;const f=o.maxW?PV.fit(t,style,size,o.maxW):{t:String(t),s:size};
  const d=PV.doc;d.setFont('helvetica',style);d.setFontSize(f.s);d.setTextColor(...PV.hex(col));
  const opt={};if(o.align)opt.align=o.align;if(o.charSpace)opt.charSpace=o.charSpace;d.text(f.t,x,y,opt)};
/* nome alinhado à direita com o papel entre parênteses em cinza: "Fulano (Presidente)" */
PV.whoR=(name,role,xr,y,o)=>{o=o||{};const size=o.size||9;let rw=0;
  if(role){const r='('+role+')';rw=PV.w(r,'italic',size-1)+3;PV.text(r,xr,y,'italic',size-1,o.roleCol||'#6E8794',{align:'right'})}
  if(!name){PV.text('a designar',xr-rw,y,'normal',size-0.5,'#B5B5B5',{align:'right'});return}
  PV.text(name,xr-rw,y,o.nameStyle||'bolditalic',size,o.nameCol||'#141414',{align:'right',maxW:o.maxW?Math.max(40,o.maxW-rw):undefined})};
PV.icon=(kind,x,y,s,bg)=>{if(PV.dry)return;const d=PV.doc,k=s/24,X=v=>x+v*k,Y=v=>y+v*k;
  d.setFillColor(255,255,255);d.setDrawColor(255,255,255);
  const poly=pts=>{const rel=[];for(let i=1;i<pts.length;i++)rel.push([(pts[i][0]-pts[i-1][0])*k,(pts[i][1]-pts[i-1][1])*k]);d.lines(rel,X(pts[0][0]),Y(pts[0][1]),[1,1],'F',true)};
  if(kind==='book'){poly([[2.5,7],[11.3,7.8],[11.3,18.8],[2.5,18.1]]);poly([[21.5,7],[12.7,7.8],[12.7,18.8],[21.5,18.1]])}
  if(kind==='wheat'){d.setLineWidth(1.1*k);d.line(X(12),Y(22.5),X(12),Y(6.5));d.ellipse(X(12),Y(4.2),1.5*k,2.6*k,'F');
    [8.6,12.4,16.2].forEach(cy=>{d.ellipse(X(10.1),Y(cy),1.35*k,2.5*k,'F');d.ellipse(X(13.9),Y(cy),1.35*k,2.5*k,'F')})}
  if(kind==='sheep'){[[10,10.5,3],[13.5,9.6,3.2],[16.8,11,2.9],[11.5,13.2,3],[15.3,13.4,3]].forEach(([cx,cy,r])=>d.circle(X(cx),Y(cy),r*k,'F'));
    d.ellipse(X(6.4),Y(11),2*k,2.6*k,'F');[[9.6,15,4.6],[11.9,15.4,4.3],[15,15.4,4.3],[17.1,14.8,4.8]].forEach(([lx,ly,h])=>d.rect(X(lx),Y(ly),1.3*k,h*k,'F'));
    d.setFillColor(...PV.hex(bg));d.circle(X(5.9),Y(10.4),0.5*k,'F')}
  if(kind==='mic'){d.roundedRect(X(9),Y(2.5),6*k,11.5*k,3*k,3*k,'F');d.setLineWidth(1.7*k);let px=null,py=null;
    for(let a=0;a<=180;a+=12){const r=a*Math.PI/180,qx=X(12+6.2*Math.cos(r)),qy=Y(11+6.2*Math.sin(r));if(px!=null)d.line(px,py,qx,qy);px=qx;py=qy}
    d.line(X(12),Y(17.2),X(12),Y(20.8));d.line(X(8.6),Y(21),X(15.4),Y(21))}
  if(kind==='chat'){d.roundedRect(X(2.5),Y(3.5),19*k,13.5*k,1.6*k,1.6*k,'F');poly([[5,16],[5,21],[10,16]]);
    d.setDrawColor(...PV.hex(bg));d.setLineWidth(1.5*k);d.line(X(7),Y(8.5),X(17),Y(8.5));d.line(X(7),Y(12),X(14),Y(12))}};

function weekFds(f){

  const dw=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][parse(f.data).getDay()];
  const bar=`<div class="fbar"><span class="dw">${dw}</span>${br(f.data)}${tp?`<span class="ev">${esc(EVENTOS[tp].toUpperCase())}</span>`:''}</div>`;
  if(SEM_REUNIAO(tp))return`<div class="fw">${bar}<div class="noreu">Não haverá reunião: ${esc(EVENTOS[tp])}</div></div>`;
  const T=m=>addMin(cfg.horaFds||'09:00',m);
  const who=(name,role)=>name?`${esc(tc(name))}${role?` <small>(${esc(role)})</small>`:''}`:`<span class="empty">a designar</span>`;
  const Rw=(t,tx,w)=>`<div class="fr"><span class="tm">${t}</span><span class="tx">${tx}</span><span class="who">${w||''}</span></div>`;
  let orN=oradorNome(f),orC=oradorCong(f);if(vis&&!orN&&ev.superintendente){orN=ev.superintendente;orC='Superintendente de circuito'}
  let s=`<div class="fw">${bar}`+Rw(T(0),'Cântico &amp; Oração',who(pname(f.presidente),'Presidente'));
  s+=`<div class="fblk f-pub"><div class="fh"><div class="ic">${ICONS2.mic}</div><h4>DISCURSO PÚBLICO</h4></div>${Rw(T(5),'<b>'+esc(discTema(f)||'Tema a definir')+'</b>',who(orN,orC))}</div>`;
  s+=`<div class="fblk f-sent"><div class="fh"><div class="ic">${ICONS2.chat}</div><h4>${vis?'RESUMO DE A SENTINELA':'ESTUDO DE A SENTINELA'}${cant(f.canticoSentinela)?`<em>Cântico ${esc(cant(f.canticoSentinela))}</em>`:''}</h4></div>${Rw(T(40),'<b>'+esc(f.sentinela.tema||'Artigo de estudo')+'</b>',vis?who(pname(f.sentinela.dirigente),'Dirigente'):who(pname(f.sentinela.dirigente),'Dirigente')+'<br>'+who(pname(f.sentinela.leitor),'Leitor'))}</div>`;
  if(vis)s+=`<div class="fblk f-pub"><div class="fh"><div class="ic">${ICONS2.mic}</div><h4>DISCURSO FINAL</h4></div>${Rw(T(70),'<b>'+esc(ev.temaFinal||'Tema a definir')+'</b>',who(ev.superintendente||'','Superintendente de circuito'))}</div>`;
  s+=Rw(T(100),'Cântico '+esc(cant(f.canticoFinal)||'')+' &amp; Oração'+(pname(f.oracaoFinal)?` <i>(${esc(tc(pname(f.oracaoFinal)))})</i>`:''),'');
  return s+'</div>'}
Object.assign(PACTS,{

/* Semanas futuras que estão em outro dia da semana que o configurado */
function misaligned(){const t=iso(new Date());
  return{ws:sortedWeeks().filter(w=>w.data>=t&&parse(w.data).getDay()!==+cfg.dia),fs:sortedFds().filter(f=>f.data>=t&&parse(f.data).getDay()!==+cfg.diaFds)}}
/* aviso na própria aba quando há reuniões futuras fora do dia configurado em Ajustes */
function misBanner(k){if(mode==='db'&&!(loaded.w&&loaded.c))return'';const m=misaligned()[k];if(!m.length)return'';const dia=k==='ws'?+cfg.dia:+cfg.diaFds;
  const dias=[...new Set(m.map(x=>DIAS[parse(x.data).getDay()]))].join(' e ');
  return`<div class="drawres short misb" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between"><span>${m.length} ${k==='ws'?'semana'+(m.length>1?'s':''):'reuni'+(m.length>1?'ões':'ão')} marcada${m.length>1?'s':''} para ${esc(dias)} (${m.slice(0,4).map(x=>br(x.data).slice(0,5)).join(', ')}${m.length>4?'…':''}), mas em Ajustes a reunião é ${k==='ws'?'de':'aos'} ${esc(DIAS[dia])}${k==='ws'?'':'s'}.</span><button class="btn small primary" data-a="alignone" data-k="${esc(k)}">Mover para ${esc(DIAS[dia])}</button></div>`}
function alignDates(only){const {ws,fs}=misaligned();let n=0;
  if(only!=='fs')ws.forEach(w=>{const nd=shiftDays(weekMonday(w.data),((+cfg.dia)+6)%7);if(nd===w.data||weeks[nd])return;const old=w.data;w.data=nd;delete weeks[old];removeDoc('semanas',old);saveWeek(w);n++});
  if(only!=='ws')fs.forEach(f=>{const nd=shiftDays(weekMonday(f.data),((+cfg.diaFds)+6)%7);if(nd===f.data||fds[nd])return;const old=f.data;f.data=nd;delete fds[old];removeDoc('fimdesemana',old);saveFds(f);n++});
  ui.week=null;ui.fdsSel=null;return n}
Object.assign(PACTS,{alignone:b=>{const n=alignDates(b.dataset.k);renderAll();toast(n+' data'+(n===1?'':'s')+' ajustada'+(n===1?'':'s'))},alignask:()=>{ui.delAsk='align';rAjustes()},alignno:()=>{ui.delAsk=null;rAjustes()},alignok:()=>{const n=alignDates();ui.delAsk=null;rAjustes();toast(n+' data'+(n===1?'':'s')+' ajustada'+(n===1?'':'s'))}});

/* ================= Limpeza do Salão do Reino ================= */
const LCOR={A:'#2F5249',B:'#4D6873',C:'#C27A0E',D:'#B0182C',E:'#6B4E9B',F:'#2E8C8E',G:'#7A5C2E',H:'#5B6B2E',I:'#8C3B6B',J:'#3B5B8C'};
const lcor=L=>LCOR[L]||'#555555';
const LTIPO={reuniao:'Limpeza a cada reunião',semanal:'Limpeza semanal'};
const DIAS3=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function sortedGroups(){return Object.values(lgr).sort((a,b)=>a.letra<b.letra?-1:1)}
function shortName(n){const w=String(n||'').split(/\s+/).filter(Boolean);if(!w.length)return'';if(['maria','ana','josé','jose','joão','joao'].includes(w[0].toLowerCase())&&w[1]&&!['de','da','das','do','dos'].includes(w[1].toLowerCase()))return tc(w[0]+' '+w[1]);return tc(w[0])}
function groupMembers(g){return(g.membros||[]).map(m=>m.rotulo||shortName(pname(m.id))).filter(Boolean)}
/* Datas de limpeza do mês: semanal no dia configurado; a cada reunião nos dias das duas reuniões */
function limpSlots(ym){const[y,m]=ym.split('-').map(Number);const last=iso(new Date(y,m,0));const out=[];let d=weekMonday(ym+'-01');
  while(d<=last){const tp=evTipo(d);
    const add=(date,tipo)=>{if(date.slice(0,7)===ym)out.push({data:date,tipo,id:date+'_'+tipo,sem:tipo==='reuniao'&&SEM_REUNIAO(tp),ev:tp})};
    add(shiftDays(d,((+cfg.diaLimpeza)+6)%7),'semanal');
    let mid=shiftDays(d,((+cfg.dia)+6)%7);if(tp==='visita')mid=shiftDays(mid,-1);add(mid,'reuniao');
    add(shiftDays(d,((+cfg.diaFds)+6)%7),'reuniao');d=shiftDays(d,7)}
  Object.values(lmp).forEach(s=>{if(s.data.startsWith(ym)&&!out.some(o=>o.id===s.data+'_'+s.tipo))out.push({data:s.data,tipo:s.tipo,id:s.data+'_'+s.tipo,extra:true})});
  return out.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.tipo==='semanal'?-1:1))}
function limpMonths(){const s=new Set(Object.values(lmp).map(x=>x.data.slice(0,7)));s.add(iso(new Date()).slice(0,7));if(ui.limpMonth)s.add(ui.limpMonth);return[...s].sort()}
/* Preenche as vagas vazias do mês seguindo o rodízio de cada tarefa (ordem das letras), continuando de onde parou */
/* Ordem do rodízio de cada tarefa: definida em Grupos (pode repetir letras). Sem ordem salva, usa as letras em ordem. */
function limpOrder(tipo){const o=((cfg.limpOrdem||{})[tipo]||[]).filter(L=>lgr[L]);if(o.length)return o;return sortedGroups().filter(g=>(g.tarefas||[]).includes(tipo)).map(g=>g.letra)}
function parseOrder(txt){return String(txt||'').toUpperCase().split(/[^A-Z]+/).filter(Boolean)}
/* posição na sequência de uma designação já feita (guarda 'pos' quando o sistema preencheu) */
function seqPos(doc,order){if(doc.pos!=null&&order[doc.pos]===doc.grupo)return doc.pos;return order.indexOf(doc.grupo)}
/* Preenche as datas vazias do mês continuando a sequência a partir da última designação anterior */
function fillLimp(ym,only){const slots=limpSlots(ym).filter(s=>!s.sem);let n=0;
  ['reuniao','semanal'].filter(t=>!only||t===only).forEach(tipo=>{const order=limpOrder(tipo);if(!order.length)return;
    const mine=slots.filter(s=>s.tipo===tipo);if(!mine.length)return;
    let lastDoc=null;Object.values(lmp).filter(s=>s.tipo===tipo&&s.grupo&&s.data<mine[0].data).sort((a,b)=>a.data<b.data?-1:1).forEach(s=>lastDoc=s);
    let idx=lastDoc?seqPos(lastDoc,order):-1;
    mine.forEach(s=>{const cur=lmp[s.id];if(cur&&cur.grupo){const p=seqPos(cur,order);if(p>=0)idx=p;return}
      idx=(idx+1)%order.length;const doc={data:s.data,tipo,grupo:order[idx],pos:idx};lmp[s.id]=doc;queueSave('limpeza',s.id,doc);n++})});
  return n}
/* Apaga as designações a partir de uma data (de uma tarefa ou das duas) e preenche de novo seguindo a sequência */
function redoLimp(from,tipo){const del=Object.values(lmp).filter(s=>s.data>=from&&(!tipo||s.tipo===tipo));const months=new Set([from.slice(0,7)]);
  del.forEach(s=>{const id=s.data+'_'+s.tipo;months.add(s.data.slice(0,7));delete lmp[id];removeDoc('limpeza',id)});
  let n=0;[...months].sort().forEach(m=>{n+=fillLimp(m,tipo)});return n}
function saveGroup(g){lgr[g.letra]=g;queueSave('limpezaGrupos',g.letra,g)}

const brl=v=>v==null||v===''||isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const numBR=v=>{if(v===''||v==null)return null;let s=String(v).trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isNaN(n)?null:n};

const plu=(q,u)=>{u=u||'';if(!u||Math.abs(q)===1||/s$/i.test(u))return u;if(u==='galão')return'galões';return/(l|r|z)$/i.test(u)?u+'es':u+'s'};

/* Consumo estimado pelas contagens: entre duas contagens, o que sumiu = (contagem anterior + compras no meio) − contagem atual */
function consumo(it){
  const ev=[...(it.historico||[])].filter(h=>h.tipo==='compra'||h.tipo==='ajuste').sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.tipo==='compra'?-1:1));
  let level=null,first=null,last=null,used=0;
  ev.forEach(h=>{if(h.tipo==='compra'){if(level!=null)level+=(+h.qtd||0)}else{if(level!=null&&first){used+=Math.max(0,level-(+h.qtd||0));last=h.data}else{first=h.data;last=h.data}level=+h.qtd||0}});
  if(!first||last===first)return{ok:false,counts:first?1:0};
  const days=(parse(last)-parse(first))/864e5;if(days<14)return{ok:false,counts:2,curto:true};
  const rate=used/days;if(rate<=0)return{ok:true,porMes:0,prev:null};
  return{ok:true,porMes:rate*30.4,prev:shiftDays(last,Math.floor((+it.qtd||0)/rate))}}
function itStatus(it){if(it.qtd==null)return'info';if(it.qtd<=0)return'zerado';if(it.minimo!=null&&it.qtd<=it.minimo)return'baixo';
  const c=consumo(it);if(c.ok&&c.prev&&c.prev<=shiftDays(iso(new Date()),30))return'breve';return'ok'}

function previsaoTxt(it){const c=consumo(it);if(!c.ok)return c.counts?'Faça outra contagem daqui a algumas semanas para estimar':'Faça contagens periódicas para estimar';
  if(!c.porMes)return'Sem consumo entre as contagens';return`≈ ${qU(Math.round(c.porMes*10)/10,it.unidade)}/mês${c.prev?' · deve durar até '+br(c.prev).slice(3):''}`}

/* ================= Áudio/Vídeo & Indicadores ================= */
function avBlank(date){return{data:date,av:'',palco:'',mic:['',''],ind:['','','']}}
function avNorm(d){const b=avBlank(d.data);return Object.assign(b,d,{mic:[0,1].map(i=>(d.mic||[])[i]||''),ind:[0,1,2].map(i=>(d.ind||[])[i]||'')})}
const isElder=id=>((pubs[id]||{}).privilegios||[]).includes('anciao');
function bros(){return Object.entries(pubs).filter(([id,p])=>p.ativo!==false&&p.sexo!=='F').sort((a,b)=>a[1].nome.localeCompare(b[1].nome,'pt')).map(([id])=>id)}
function avOps(){const l=bros().filter(id=>(pubs[id].cats||[]).includes('av'));return l.length?l:bros()}
/* Reuniões do mês: meio de semana (um dia antes na visita) e fim de semana */
function avSlots(ym){const[y,m]=ym.split('-').map(Number);const last=iso(new Date(y,m,0));const out=[];let d=weekMonday(ym+'-01');
  while(d<=last){const tp=evTipo(d);let mid=shiftDays(d,((+cfg.dia)+6)%7);if(tp==='visita')mid=shiftDays(mid,-1);
    [[mid,'meio'],[shiftDays(d,((+cfg.diaFds)+6)%7),'fds']].forEach(([dt,k])=>{if(dt.slice(0,7)===ym)out.push({data:dt,id:dt,kind:k,sem:SEM_REUNIAO(tp),ev:tp})});d=shiftDays(d,7)}
  return out.sort((a,b)=>a.data<b.data?-1:1)}
function avIds(d){return[d.av,d.palco,...d.mic,...d.ind].filter(Boolean)}
/* quem já tem parte nesta reunião (para não sobrecarregar) */
function avBusy(date,kind){const s=new Set();
  if(kind==='meio'){const w=impTarget(date);if(w)roles(w).forEach(r=>s.add(r.pub))}
  else{const mon=weekMonday(date);const f=sortedFds().find(x=>weekMonday(x.data)===mon);if(f){rolesFds(f).forEach(r=>s.add(r.pub));if(!f.discurso.visitante&&f.discurso.oradorId)s.add(f.discurso.oradorId)}}
  return s}
function avLast(id,before,field){let l='';Object.values(avd).forEach(d0=>{const d=avNorm(d0);if(d.data>=before)return;const hit=field?(field==='av'||field==='palco'?d[field]===id:d[field].includes(id)):avIds(d).includes(id);if(hit&&d.data>l)l=d.data});return l}
function avCount(id,from,to){let n=0;Object.values(avd).forEach(d0=>{const d=avNorm(d0);if(d.data>=from&&d.data<=to&&avIds(d).includes(id))n++});return n}
function avSince(id,date){const l=avLast(id,date);if(!l)return'nunca';const wk=Math.round((parse(date)-parse(l))/6048e5);return wk<=0?'esta semana':'há '+wk+' sem'}
/* Preenche as vagas vazias do mês: quem está há mais tempo sem servir vai primeiro */
function avFill(ym){let n=0;const shuffleTie=new Map();
  avSlots(ym).filter(s=>!s.sem).forEach(s=>{const d=avNorm(avd[s.id]||avBlank(s.data));const parts=avBusy(s.data,s.kind);const busy=new Set(avIds(d));
    const from=shiftDays(s.data,-90);
    /* primeiro quem está livre; se ninguém estiver, aceita quem tem parte na reunião (aparece o aviso) */
    const pick=(pool,field)=>{let c=pool.filter(id=>!busy.has(id)&&!parts.has(id));if(!c.length)c=pool.filter(id=>!busy.has(id));if(!c.length)return'';
      c.forEach(id=>{if(!shuffleTie.has(id))shuffleTie.set(id,Math.random())});
      c.sort((a,b)=>{const la=avLast(a,s.data,field),lb=avLast(b,s.data,field);if(la!==lb)return la<lb?-1:1;const ga=avLast(a,s.data),gb=avLast(b,s.data);if(ga!==gb)return ga<gb?-1:1;
        const ca=avCount(a,from,s.data),cb=avCount(b,from,s.data);if(ca!==cb)return ca-cb;return shuffleTie.get(a)-shuffleTie.get(b)});
      busy.add(c[0]);n++;return c[0]};
    if(!d.av)d.av=pick(avOps(),'av');
    if(!d.ind.some(id=>id&&isElder(id))){const i=d.ind.findIndex(x=>!x);if(i>=0)d.ind[i]=pick(bros().filter(isElder),'ind')}
    if(!d.palco)d.palco=pick(bros(),'palco');
    d.mic=d.mic.map(x=>x||pick(bros(),'mic'));
    d.ind=d.ind.map(x=>x||pick(bros(),'ind'));
    avd[s.id]=d;queueSave('av',s.id,d)});
  return n}
function avWarn(s,d){const w=[];const ids=avIds(d);const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);if(dup.length)w.push([...new Set(dup)].map(x=>tc(pname(x))).join(', ')+' em mais de uma função');
  if(d.ind.some(Boolean)&&!d.ind.some(id=>id&&isElder(id)))w.push('nenhum ancião entre os indicadores');
  const busy=avBusy(s.data,s.kind);const cf=ids.filter(id=>busy.has(id));if(cf.length)w.push([...new Set(cf)].map(x=>tc(pname(x))).join(', ')+' também tem parte nesta reunião');return w}

  $('#v-av').innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">

/* Aceita Excel (.xlsx/.xls/.csv), Word (.docx), PDF, RTF ou texto. Cada linha: nome, telefone e qualificações

const XLSX_URL='lib/xlsx.full.min.js';
const JSZIP_URL='lib/jszip.min.js';
const foldTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();

const telFim=t=>String(t||'').replace(/\D/g,'').slice(-8);
function fmtTelBR(d){d=telDig(d);if(!d)return'';const m=/^55(\d{2})(\d{4,5})(\d{4})$/.exec(d);return m?`(${m[1]}) ${m[2]}-${m[3]}`:'+'+d}
/* nomes femininos que não terminam em "a" e masculinos que terminam (ajuste fino do palpite de irmão/irmã) */
const NOME_F=new Set(['isa','raquel','ester','rute','miriam','lilian','floranice','evelyn','rallyne','rafaelly','ketely','nikelle','idalecia','marismar','yasmin','gilmara','raline','luane','rosimeire','meire','michele','michelle','reijane','rejane','eunice','cleide','stephenie','tayane','ivone','iriene','marlene','milca','raimunda','vanusa','neve','neves','beatriz','isabel','carmem','ruth','ingrid','alice','aline','jaqueline','denise','elisa','elaine','irene','ines','lourdes','mercedes','nair','noemi','priscila','rosangela','simone','solange','suely','vitoria','tereza','terezinha','teresa']);
const NOME_M=new Set(['luca','lucca','joshua','elias','jonas','matias','tobias','isaias','jeremias','zacarias','nicolas','barnabe','jona','andrea','sasha']);
function palpiteSexo(nome,priv){if((priv||[]).some(p=>p==='anciao'||p==='servo'))return'M';const f=foldTxt(nome).split(' ')[0]||'';

function lerQualif(t){const f=foldTxt(t);const p=[];if(/\bancia|\banciao|\banciaos/.test(f))p.push('anciao');if(/\bservo|\bs\.?\s?m\b/.test(f))p.push('servo');if(/pioneir/.test(f))p.push('pioneiro');return p}
/* uma linha de texto solta → {nome, tel, priv} */
function linhaPub(raw){let s=String(raw||'').replace(/ /g,' ').trim();if(!s)return null;let priv=[];
  s=s.replace(/\(([^)]*)\)/g,(m,x)=>{const q=lerQualif(x);if(q.length){priv=priv.concat(q);return' '}return m});

/* linhas de uma planilha: usa o cabeçalho se houver colunas reconhecíveis */
function linhasPlanilha(rows){rows=rows.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(Boolean));if(!rows.length)return[];
  const H=rows[0].map(foldTxt);const col=re=>H.findIndex(h=>re.test(h));
  const cN=col(/^nome|publicador/),cT=col(/telefone|whats|celular|fone|contato|numero/),cQ=col(/qualifica|privil|cargo|funcao|designa/);
  if(cN>=0){return rows.slice(1).map(r=>{const nome=r[cN]||'';if(!nome)return null;const x=linhaPub(nome)||{nome:tc(nome),tel:'',priv:[]};
    if(cT>=0&&r[cT])x.tel=telDig(r[cT])||x.tel;if(cQ>=0&&r[cQ])x.priv=[...new Set(x.priv.concat(lerQualif(r[cQ])))];return x}).filter(Boolean)}

async function lerListaArquivo(f){const buf=new Uint8Array(await f.arrayBuffer());const name=(f.name||'').toLowerCase();
  const head=new TextDecoder('latin1').decode(buf.slice(0,8));const zip=buf[0]===0x50&&buf[1]===0x4B,ole=buf[0]===0xD0&&buf[1]===0xCF;
  const planilha=async()=>{await loadScript(XLSX_URL);const wb=window.XLSX.read(buf,{type:'array'});let out=[];
    wb.SheetNames.forEach(n=>{out=out.concat(linhasPlanilha(window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''})))});return out};
  if(/\.csv$/.test(name)){const t=new TextDecoder('utf-8').decode(buf);const l0=t.split('\n')[0];const sep=(l0.match(/;/g)||[]).length>(l0.match(/,/g)||[]).length?';':(l0.includes('\t')?'\t':',');return linhasPlanilha(t.split(/\r?\n/).map(l=>l.split(sep)))}
  if(ole){if(/\.doc$/.test(name))throw new Error('Arquivos .doc (Word antigo) não podem ser lidos. No Word, use "Salvar como" › Documento do Word (.docx) e envie de novo.');return planilha()}
  if(zip){await loadScript(JSZIP_URL);const z=await window.JSZip.loadAsync(buf);const x=z.file('word/document.xml');
    if(!x){if(z.file('xl/workbook.xml')||z.file('content.xml'))return planilha();throw new Error('Não reconheci este arquivo. Envie uma planilha do Excel, um documento do Word (.docx), PDF ou texto.')}
    const xml=await x.async('string');const doc=new DOMParser().parseFromString(xml,'application/xml');const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';

/* compara cada linha com o cadastro: mesmo nome; ou primeiro e último nome; ou mesmo telefone com o mesmo primeiro nome */
function casarPub(x,usados){const fn=foldTxt(x.nome),tk=fn.split(' ');const L=Object.entries(pubs).filter(([id])=>!usados.has(id));

function planoImport(lista){const usados=new Set();const linhas=lista.map(x=>{const id=casarPub(x,usados);if(id)usados.add(id);const p=id?pubs[id]:null;const mud=[];

      if(x.tel&&telFim(x.tel)!==telFim(p.tel))mud.push('tel');

/* ================= Equilíbrio das designações ================= */
function equilibrio(de,ate){const c={};const add=(id,k)=>{if(!id||!pubs[id])return;const x=c[id]=c[id]||{meio:0,fds:0,av:0,campo:0,total:0,ult:''};x[k]++;x.total++};
  const last=(id,d)=>{if(c[id]&&d>c[id].ult)c[id].ult=d};
  sortedWeeks().forEach(w=>{const d=meetDate(w);if(d<de||d>ate)return;roles(w).forEach(r=>{add(r.pub,'meio');last(r.pub,d)})});
  sortedFds().forEach(f=>{if(f.data<de||f.data>ate)return;rolesFds(f).forEach(r=>{add(r.pub,'fds');last(r.pub,f.data)})});
  Object.values(avd).forEach(d0=>{const d=avNorm(d0);if(!d.data||d.data<de||d.data>ate)return;avIds(d).forEach(id=>{add(id,'av');last(id,d.data)})});
  Object.values(cmp).forEach(cw=>(cw.saidas||[]).forEach(r=>{const d=cDate(cw.semana,r.dia);if(d<de||d>ate||!r.dir)return;add(r.dir,'campo');last(r.dir,d)}));
  return c}
function rEquilibrio(){const v=$('#v-equilibrio');const M=ui.eqMeses||3;const hoje=iso(new Date());const fut=ui.eqFuturo!==false;const de=shiftMonth(hoje.slice(0,7),-M)+hoje.slice(7),ate=fut?shiftDays(hoje,62):hoje;
  const c=equilibrio(de,ate);const cat=ui.eqCat||'';const K=ui.eqTipo||'total';
  let ids=Object.keys(pubs).filter(id=>pubs[id].ativo!==false&&(!cat||(cat==='F'||cat==='M'?pubs[id].sexo===cat:(pubs[id].cats||[]).includes(cat))));
  ids=ids.filter(id=>(pubs[id].cats||[]).length||c[id]);
  const val=id=>(c[id]||{})[K]||0;ids.sort((a,b)=>(val(b)-val(a))||pname(a).localeCompare(pname(b),'pt'));
  const vals=ids.map(val).sort((a,b)=>a-b);const max=Math.max(1,...vals);
  const media=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const muito=id=>val(id)>=Math.max(3,Math.ceil(media*2)),nada=id=>val(id)===0;
  const nM=ids.filter(muito).length,nZ=ids.filter(nada).length;
  v.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px;max-width:900px">
    <div class="panel" style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <div><h2 style="margin:0">Equilíbrio das designações</h2><p class="hint" style="margin:4px 0 0">Quantas partes cada um teve no período, somando meio de semana, fim de semana, A/V e indicadores e saídas de campo dirigidas. Ajuda a não sobrecarregar uns e esquecer outros.</p></div>
      <div class="eqf"><label class="f">Período<select id="eqmes">${[1,2,3,6,12].map(m=>`<option value="${m}" ${m===M?'selected':''}>Últimos ${m} ${m===1?'mês':'meses'}</option>`).join('')}</select></label>
        <label class="f">Contar<select id="eqtipo">${[['total','Todas as partes'],['meio','Meio de semana'],['fds','Fim de semana'],['av','A/V e indicadores'],['campo','Saídas de campo']].map(([k,l])=>`<option value="${k}" ${k===K?'selected':''}>${l}</option>`).join('')}</select></label>
        <label class="f">Quem<select id="eqcat"><option value="">Todos com alguma categoria</option><option value="M" ${cat==='M'?'selected':''}>Só irmãos</option><option value="F" ${cat==='F'?'selected':''}>Só irmãs</option><optgroup label="Pode ser designado para">${CATS.map(([k,l])=>`<option value="${k}" ${k===cat?'selected':''}>${l}</option>`).join('')}</optgroup></select></label>
        <label class="eqfut"><input type="checkbox" id="eqfut" ${fut?'checked':''}> Incluir os próximos 2 meses já designados</label></div>
      <div class="eqres">${nZ?`<span class="nao"><b>${nZ}</b> sem nenhuma parte</span>`:''}${nM?`<span class="mto"><b>${nM}</b> com o dobro da média ou mais</span>`:''}<span>Média: <b>${media.toFixed(1).replace('.',',')}</b> parte${media>0&&media<2?'':'s'} por pessoa</span><span class="muted">${br(de)} a ${br(ate)}</span></div>
    </div>
    <div class="panel tablewrap"><table class="pubs eqtab"><thead><tr><th>Nome</th><th>Partes</th><th class="eqnum">Meio</th><th class="eqnum">Fim de sem.</th><th class="eqnum">A/V</th><th class="eqnum">Campo</th><th>Última</th></tr></thead><tbody>
      ${ids.map(id=>{const x=c[id]||{meio:0,fds:0,av:0,campo:0,total:0,ult:''};return`<tr class="${muito(id)?'mto':nada(id)?'nao':''}"><td><b>${esc(tc(pname(id)))}</b></td><td><span class="eqbar"><i style="width:${Math.round(100*val(id)/max)}%"></i></span><b>${val(id)}</b></td><td class="eqnum">${x.meio}</td><td class="eqnum">${x.fds}</td><td class="eqnum">${x.av}</td><td class="eqnum">${x.campo}</td><td>${x.ult?br(x.ult).slice(0,5):'<span class="muted">—</span>'}</td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Ninguém neste filtro.</td></tr>'}
    </tbody></table></div></div>`}

/* restaura uma cópia (arquivo ou cópia guardada no servidor); com "subst", apaga o que não estiver na cópia */
async function restaurarDados(d,subst){if(window.FBX)window.FBX.quiet=true;let n=0,del=0;
  try{
    if(subst){const M={publicadores:pubs,semanas:weeks,fimdesemana:fds,eventos:evs,limpezaGrupos:lgr,limpeza:lmp,estoque:stk,av:avd,campo:cmp};
      for(const[c,m]of Object.entries(M)){if(!d[c])continue;for(const id of Object.keys(m)){if(!(id in d[c])){delete m[id];await store.del(c,id);del++}}}}
    for(const[id,p]of Object.entries(d.publicadores||{})){pubs[id]=p;await store.set('publicadores',id,p);n++}
    for(const[id,w]of Object.entries(d.semanas||{})){weeks[id]=norm(w);await store.set('semanas',id,weeks[id]);n++}
    for(const[id,f]of Object.entries(d.fimdesemana||{})){fds[id]=normF(f);await store.set('fimdesemana',id,fds[id]);n++}
    for(const[id,v]of Object.entries(d.eventos||{})){evs[id]=v;await store.set('eventos',id,v);n++}
    for(const[id,v]of Object.entries(d.limpezaGrupos||{})){lgr[id]=v;await store.set('limpezaGrupos',id,v);n++}
    for(const[id,v]of Object.entries(d.limpeza||{})){lmp[id]=v;await store.set('limpeza',id,v);n++}
    for(const[id,v]of Object.entries(d.estoque||{})){stk[id]=v;await store.set('estoque',id,v);n++}
    for(const[id,v]of Object.entries(d.av||{})){avd[id]=v;await store.set('av',id,v);n++}
    for(const[id,v]of Object.entries(d.campo||{})){cmp[id]=v;await store.set('campo',id,v);n++}
    if(d.config){const ub=cfg.ultimoBackup;cfg=Object.assign({},DEF_CFG,d.config);if(ub)cfg.ultimoBackup=ub;await store.set('config','geral',cfg)}
  }finally{if(window.FBX)window.FBX.quiet=false}
  buildHist();if(window.FBX)window.FBX.log('restaurou','config','copia');return{n,del}}
document.addEventListener('change',e=>{if(e.target.id!=='c-import')return;if(!isAdm()){toast('Só administradores restauram cópias');return}const f=e.target.files[0];if(!f)return;const r=new FileReader();
  const subst=!!($('#c-import-subst')||{}).checked;
  if(subst&&!confirm('Substituir tudo: o que estiver no sistema e não estiver na cópia será apagado (publicadores, semanas, fim de semana, limpeza, itens, A/V e campo). Continuar?')){e.target.value='';return}
  r.onload=async()=>{let d;try{d=JSON.parse(r.result)}catch(err){toast('Arquivo inválido');e.target.value='';return}
    try{const x=await restaurarDados(d,subst);toast(x.n+' registros restaurados'+(x.del?', '+x.del+' removidos':''))}catch(err){toast('Não foi possível restaurar tudo ('+((err&&err.code)||'erro')+')')}
    e.target.value='';rAjustes()};r.readAsText(f)});

/* ----- Lista de acesso (só administradores conseguem ler): usada em Ajustes, Confirmações e Publicadores ----- */
function acessoInit(){const F=window.FBX;if(ui.accSub||!F||F.papel!=='admin'||!F.listAccess)return;ui.accSub=true;
  F.listAccess(l=>{ui.acc=l;acessoMudou()},()=>{ui.acc=null});
  if(F.listAceites)F.listAceites(m=>{ui.aceites=m;acessoMudou()},()=>{})}
function acessoMudou(){if(ui.tab==='ajustes')drawAcc();else if(['confirmacoes','publicadores'].includes(ui.tab))renderAll(true)}
/* situação de cada publicador no painel: 'ativo' (já entrou), 'convidado' (tem acesso, ainda não entrou), 'sem' (sem acesso); null = não dá para saber */
function acessoDe(pid){const F=window.FBX;if(!F||F.papel!=='admin'||!ui.acc)return null;
  const a=ui.acc.find(x=>x.pub===pid)||(F.owner&&F.pubId===pid?{email:F.owner}:null);if(!a)return'sem';
  return(ui.aceites||{})[a.email]?'ativo':'convidado'}

/* ----- Cópias automáticas no servidor: uma por semana, guardando as 8 mais recentes ----- */
const dadosAtuais=()=>({publicadores:pubs,semanas:weeks,fimdesemana:fds,eventos:evs,limpezaGrupos:lgr,limpeza:lmp,estoque:stk,av:avd,campo:cmp,config:cfg});
const contaRegs=d=>['publicadores','semanas','fimdesemana','eventos','limpezaGrupos','limpeza','estoque','av','campo'].reduce((a,k)=>a+Object.keys(d[k]||{}).length,0);
let copias=null;
function copiasInit(){const F=window.FBX;if(ui.copSub||!F||!F.copias||F.papel!=='admin')return;ui.copSub=true;
  F.copias.listar(l=>{copias=l;copiaAuto();bkCheck();if(ui.tab==='ajustes')drawCopias()},()=>{copias=[];bkCheck()})}
async function copiaAuto(){const F=window.FBX;if(!copias||copiaAuto.feito||!F||F.papel!=='admin')return;
  if(!(loaded.p&&loaded.w&&loaded.c&&loaded.f&&loaded.e))return; // só com todos os dados do servidor
  const ult=copias[0];const dias=ult?Math.floor((Date.now()-parse(ult.id.slice(0,10)).getTime())/864e5):999;
  copiaAuto.feito=true;if(dias<7)return;
  await guardarCopia(true)}
async function guardarCopia(auto){const F=window.FBX;const d=dadosAtuais();const n=contaRegs(d);
  if(n<5){if(!auto)toast('Não há dados suficientes para guardar');return false} // nunca guarda uma cópia vazia por cima das boas
  const id=iso(new Date())+(auto?'':'-'+pad(new Date().getHours())+pad(new Date().getMinutes()));
  try{await F.copias.salvar(id,JSON.stringify(d),n,!!auto);
    const velhas=(copias||[]).filter(c=>c.id!==id).slice(7);for(const c of velhas){try{await F.copias.apagar(c.id)}catch(e){}}
    if(!auto)toast('Cópia guardada');return true}catch(e){if(!auto)toast('Não foi possível guardar a cópia ('+((e&&e.code)||'erro')+')');return false}}
function drawCopias(){const box=$('#copiasBox');if(!box)return;const F=window.FBX;if(!F||F.papel!=='admin'||!F.copias){box.innerHTML='';return}
  copiasInit();const l=copias;
  box.innerHTML=`<div class="accbox"><h3 style="margin:0 0 4px;font-size:16px">Cópias guardadas no servidor</h3>
    <p class="hint" style="margin:0 0 10px">Uma cópia de tudo é guardada sozinha toda semana, quando um administrador entra. Ficam as 8 mais recentes. Para recuperar algo apagado por engano, use "Restaurar".</p>
    ${l==null?'<div class="muted" style="font-size:14px">Carregando…</div>':l.length?`<div class="acclist">${l.map(c=>`<div class="accrow cprow"><span><b>${br(c.id.slice(0,10))}</b>${c.id.length>10?' '+esc(c.id.slice(11,13)+':'+c.id.slice(13,15)):''}<br><small class="muted">${esc(String(c.n||'?'))} registros · ${c.auto?'automática':'guardada por '+who(c.por)}</small></span>
      ${ui.delAsk==='cop'+c.id?`<span class="confirm"><button class="btn small danger" data-a="coprestok" data-id="${esc(c.id)}">Restaurar esta cópia</button><button class="btn small" data-a="accno">Não</button></span>`:`<span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn small" data-a="copbaixar" data-id="${esc(c.id)}">Baixar</button><button class="btn small" data-a="coprest" data-id="${esc(c.id)}">Restaurar</button></span>`}</div>`).join('')}</div>`:'<div class="muted" style="font-size:14px">Nenhuma cópia ainda. A primeira é guardada assim que os dados terminam de carregar.</div>'}
    <div style="margin-top:10px"><button class="btn small" data-a="copagora">Guardar uma cópia agora</button></div></div>`}
Object.assign(PACTS,{
  copagora:async()=>{await guardarCopia(false)},
  copbaixar:async b=>{const c=(copias||[]).find(x=>x.id===b.dataset.id);if(!c)return;await saveFile('designacoes-copia-'+c.id+'.json',new Blob([c.dados],{type:'application/json'}))},
  coprest:b=>{ui.delAsk='cop'+b.dataset.id;drawCopias()},
  coprestok:async b=>{const c=(copias||[]).find(x=>x.id===b.dataset.id);ui.delAsk=null;if(!c)return;
    await guardarCopia(false); // antes, guarda o estado atual (para poder desfazer)
    try{const x=await restaurarDados(JSON.parse(c.dados),true);toast('Cópia de '+br(c.id.slice(0,10))+' restaurada ('+x.n+' registros)')}catch(e){toast('Não foi possível restaurar ('+((e&&e.code)||'erro')+')')}
    rAjustes()}});

/* ----- Erros nos aparelhos: quando algo falha no celular de alguém, fica um aviso que só administradores veem ----- */
let errN=0;const errVistos=new Set();
function regErro(msg,pilha,onde){const F=window.FBX;if(!F||!F.erro||!F.email||errN>=5)return;const k=String(msg||'').slice(0,200);if(!k||errVistos.has(k))return;errVistos.add(k);errN++;
  F.erro({msg:k,pilha:String(pilha||'').slice(0,1900),onde:String(onde||'').slice(0,200),versao:String(F.versao||''),tela:String(location.hash||'#').slice(0,40),aparelho:navigator.userAgent.slice(0,300)}).catch(()=>{})}
window.addEventListener('error',e=>{if(e.filename&&!e.filename.startsWith(location.origin))return;regErro(e.message,e.error&&e.error.stack,(e.filename||'').split('/').pop()+':'+(e.lineno||''))});
window.addEventListener('unhandledrejection',e=>{const r=e.reason||{};if(r&&r.code==='permission-denied')return;regErro(r.message||String(r),r.stack,'promessa')});
function drawErros(){const box=$('#errBox');if(!box)return;const F=window.FBX;if(!F||F.papel!=='admin'||!F.erros){box.innerHTML='';return}

      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-a="errcopiar">Copiar para enviar</button><button class="btn small ghost" data-a="errlimpar">Limpar a lista</button></div>`:'<div class="muted" style="font-size:14px">Nenhum erro registrado.</div>'}</div>`}
Object.assign(PACTS,{
  errcopiar:()=>copyText((ui.erros||[]).map(x=>[tsLabel(x.em),x.por,x.tela,'v'+x.versao,x.onde,x.msg,x.aparelho,(x.pilha||'').split('\n').slice(0,4).join(' | ')].join(' · ')).join('\n')),
  errlimpar:async()=>{for(const x of ui.erros||[]){try{await window.FBX.erros.apagar(x.id)}catch(e){}}toast('Lista limpa')}});

/* ----- Diagnóstico: confere o site publicado (arquivos, versão, banco, PDF e planilhas) ----- */
const ARQS=['config.js','manifest.webmanifest','sw.js','icon-180.png','icon-192.png','icon-512.png','icon-maskable-512.png','404.html',
  'lib/firebase-app-compat.js','lib/firebase-auth-compat.js','lib/firebase-firestore-compat.js','lib/jspdf.umd.min.js','lib/jszip.min.js','lib/xlsx.full.min.js','lib/pdfjs/pdf.min.js','lib/pdfjs/pdf.worker.min.js'];
async function versaoPublicada(){try{const r=await fetch('versao.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return(await r.json()).versao||null}catch(e){return null}}
async function diagnostico(){const out=[];const add=(ok,t,d)=>out.push({ok,t,d});const F=window.FBX;
  const pub=await versaoPublicada();
  if(!pub)add(false,'Versão','Não encontrei o arquivo versao.json no site. Envie todos os arquivos da última versão.');
  else if(pub!==F.versao)add(false,'Versão',`Este aparelho está com a versão ${F.versao}, e a publicada é ${pub}. Recarregue a página.`);
  else add(true,'Versão',`Atualizada (${pub}).`);
  const falta=[];await Promise.all(ARQS.map(async a=>{try{const r=await fetch(a+'?t='+Date.now(),{method:'HEAD',cache:'no-store'});if(!r.ok)falta.push(a)}catch(e){falta.push(a)}}));
  add(!falta.length,'Arquivos do site',falta.length?'Faltam no GitHub: '+falta.join(', ')+'.':`Todos os ${ARQS.length} arquivos estão no lugar.`);
  try{await F.ping();add(true,'Banco de dados','Conectado ao Firebase.')}catch(e){add(false,'Banco de dados','Sem resposta do Firebase ('+((e&&e.code)||'erro')+'). Verifique a internet.')}
  add(loaded.p&&loaded.w&&loaded.c,'Dados carregados',loaded.p&&loaded.w&&loaded.c?`${Object.keys(pubs).length} publicadores e ${Object.keys(weeks).length} semanas.`:'Os dados ainda não terminaram de carregar.');
  add(!!window.jspdf,'Gerar PDF',window.jspdf?'Gerador de PDF carregado.':'O gerador de PDF não carregou (lib/jspdf.umd.min.js).');
  try{await ensurePdfjs();add(true,'Ler apostila em PDF','Leitor de PDF funcionando.')}catch(e){add(false,'Ler apostila em PDF','O leitor de PDF não carregou.')}
  try{await loadScript(XLSX_URL);add(!!window.XLSX,'Planilhas (Excel)','Leitor de planilhas funcionando.')}catch(e){add(false,'Planilhas (Excel)','O leitor de planilhas não carregou.')}
  const sw='serviceWorker' in navigator&&location.protocol==='https:';let swOk=false;if(sw){try{swOk=!!(await navigator.serviceWorker.getRegistration())}catch(e){}}
  add(swOk||!sw,'Aplicativo e uso sem internet',swOk?'Instalável e com cópia no aparelho.':sw?'Ainda não ativado neste aparelho. Recarregue a página uma vez.':'Disponível só no endereço https do site.');
  return out}
function drawDiag(){const box=$('#diagBox');if(!box)return;const F=window.FBX;if(!F||F.papel!=='admin'||!F.ping){box.innerHTML='';return}
  const r=ui.diag;box.innerHTML=`<div class="accbox"><h3 style="margin:0 0 4px;font-size:16px">Conferir o site</h3><p class="hint" style="margin:0 0 10px">Use depois de cada publicação no GitHub: confere se todos os arquivos estão lá, se a versão é a mais nova e se banco, PDF e planilhas funcionam neste aparelho.</p>
    ${r==='rodando'?'<div class="muted" style="font-size:14px">Conferindo…</div>':Array.isArray(r)?`<div class="diaglist">${r.map(x=>`<div class="diagrow ${x.ok?'ok':'falha'}"><span class="diagic" aria-hidden="true">${x.ok?'✓':'!'}</span><span><b>${esc(x.t)}</b><br><small>${esc(x.d)}</small></span></div>`).join('')}</div>`:''}
    <div style="margin-top:10px"><button class="btn small" data-a="diagrodar">${Array.isArray(r)?'Conferir de novo':'Conferir agora'}</button></div></div>`}
Object.assign(PACTS,{diagrodar:async()=>{ui.diag='rodando';drawDiag();try{ui.diag=await diagnostico()}catch(e){ui.diag=[{ok:false,t:'Diagnóstico',d:'Não foi possível concluir ('+e.message+').'}]}drawDiag()}});

/* ----- Aviso de versão nova publicada (site): confere ao abrir e a cada 30 minutos ----- */
async function checarVersaoNova(){const F=window.FBX;if(!F||!F.versao||location.protocol!=='https:')return;const v=await versaoPublicada();
  if(v&&v!==F.versao&&!$('#novaVersao')){document.body.insertAdjacentHTML('beforeend',`<div id="novaVersao" class="novaver" role="status"><span>Há uma versão nova do sistema.</span><button class="btn small primary" data-a="recarregar">Atualizar agora</button></div>`)}}
Object.assign(PACTS,{recarregar:()=>location.reload()});
setTimeout(checarVersaoNova,8000);setInterval(checarVersaoNova,30*60*1000);

/* ================= Lembrete do S-89: 3 semanas antes, avisa quem ainda não recebeu a designação de Faça Seu Melhor no Ministério ================= */
const S89_DIAS=21;
const podeEditarS89=()=>!window.FBX||['admin','editor'].includes(window.FBX.papel);
/* participantes de Faça Seu Melhor no Ministério de uma semana: quem faz a parte e o ajudante */
function s89Pendentes(w){const out={pend:[],vagas:0};
  (w.ministerio||[]).forEach((p,i)=>{const t=partTipo(p);if(t==='presidente'||t==='consideracao')return;
    if(!p.pub){out.vagas++;return}
    const quem=[[p.pub,'parte']];if(!isDiscurso(p)&&p.ajudante)quem.push([p.ajudante,'ajudante']);else if(!isDiscurso(p))out.vagas++;
    quem.forEach(([pid,papel])=>{if(!(w.enviados||{})[pid])out.pend.push({pid,papel,n:4+i,tema:temaLabel(p)})})});
  return out}
function s89Avisos(){const hoje=iso(new Date()),lim=shiftDays(hoje,S89_DIAS);const r=[];
  sortedWeeks().forEach(w=>{const d=meetDate(w);if(d<hoje||d>lim||SEM_REUNIAO(evTipo(w.data)))return;
    const x=s89Pendentes(w);if(!x.pend.length&&!x.vagas)return;
    let adiado=0;try{adiado=+localStorage.getItem('vmc-s89-adiar-'+w.data)||0}catch(e){}if(Date.now()<adiado)return;
    r.push({w,d,dias:Math.round((parse(d)-parse(hoje))/864e5),pend:x.pend,vagas:x.vagas})});
  return r}
function lembreteS89(){const box=$('#s89Box');if(!box)return;
  if(!podeEditarS89()||painelOnly()||!['semanas','fimdesemana','imprimir','confirmacoes'].includes(ui.tab)||!loaded.w){box.hidden=true;return}
  const av=s89Avisos();if(!av.length){box.hidden=true;return}
  box.innerHTML=av.map(a=>{const urg=a.dias<=7;const nomes=[...new Set(a.pend.map(p=>tc(pname(p.pid))))];
    const quando=a.dias===0?'hoje':a.dias===1?'amanhã':'em '+a.dias+' dias';
    return`<div class="s89av ${urg?'urg':''}"><div class="s89txt"><b>S-89 · reunião de ${br(a.d)} (${quando})</b>
      <span>${a.pend.length?`${a.pend.length} ${a.pend.length===1?'designação de Faça Seu Melhor no Ministério ainda não foi encaminhada':'designações de Faça Seu Melhor no Ministério ainda não foram encaminhadas'}: ${esc(nomes.join(', '))}.`:''}${a.vagas?` ${a.vagas===1?'Falta 1 designado':'Faltam '+a.vagas+' designados'} nas partes.`:''}</span></div>
      <span class="s89act"><a class="btn small ${urg?'primary':''}" href="#whatsapp" data-a="s89ir" data-w="${esc(a.w.data)}">Encaminhar</a><button class="btn small ghost" data-a="s89adiar" data-w="${esc(a.w.data)}">Lembrar amanhã</button></span></div>`}).join('');
  box.hidden=false}
Object.assign(PACTS,{
  s89ir:b=>{ui.waKind='meio';ui.waWeek=b.dataset.w},
  s89adiar:b=>{try{localStorage.setItem('vmc-s89-adiar-'+b.dataset.w,String(Date.now()+864e5))}catch(e){}lembreteS89()}});

/* ================= Início: roda depois que todas as partes foram carregadas ================= */
route();init();

</script>
